apiVersion: apps/v1
kind: Deployment
metadata:
  name: php-3tier-cicd
  labels:
    app: php-3tier-cicd
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: php-3tier-cicd
  template:
    metadata:
      labels:
        app: php-3tier-cicd
    spec:
      containers:
        - name: php
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 80
          env:
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: mysql-config
                  key: DB_HOST
            - name: DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: mysql-config
                  key: DB_NAME
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: MYSQL_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: MYSQL_PASSWORD
